<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>1090 Fruits 3D — Sci-Fi Combat Arena</title>
    <!-- Inline so the page is never a white screen, even if every external request fails. -->
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; color: #dff6ff;
        font-family: 'Rajdhani', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      #boot .box { max-width: 620px; }
      #boot .title { font-size: 15px; letter-spacing: .18em; color: #7fe6ff; margin-bottom: 10px; }
      #boot .msg { font-size: 13px; line-height: 1.6; color: #9fdcf5; }
      #boot .hint { font-size: 12px; line-height: 1.6; color: #6f9ab0; margin-top: 10px; }
      #boot code { color: #ffd479; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 3px; }
      .dots::after { content: ''; animation: d 1.2s steps(4, end) infinite; }
      @keyframes d { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking: a blocked or slow font CDN must never delay first paint
         (the game falls back to system fonts until these arrive). -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="box">
        <div class="title">1090 FRUITS // OPERATOR</div>
        <div class="msg" id="boot-msg">Booting arena<span class="dots"></span></div>
        <div class="hint" id="boot-hint"></div>
        <noscript>
          <div class="msg" style="margin-top:14px">JavaScript is disabled in this browser.</div>
          <div class="hint">The 3D arena is rendered entirely by JavaScript, so it cannot start without it.
            Enable JavaScript for this site, then reload.</div>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Boot watchdog. Handles the two ways a page can "boot forever":
      //  1. the browser is showing a stale cached copy whose script no longer exists -> reload once
      //     with a cache-busting parameter (loop-proof: skipped if the URL already carries it);
      //  2. the app really cannot start -> explain why, naming the script that failed.
      (function () {
        var mounted = function () {
          var root = document.getElementById('root');
          return !!(root && root.childElementCount > 0);
        };
        var started = function () { return !!(window.__appStarted || mounted()); };
        var alreadyTried = new URLSearchParams(location.search).has('_boot');

        // progress feedback while the bundle downloads and initialises
        window.__bootTimer = setTimeout(function () {
          if (started()) return;
          var m = document.getElementById('boot-msg');
          if (m) m.innerHTML = 'Downloading engine<span class="dots"></span>';
        }, 1200);
        // keeps the user informed instead of looking frozen while the game builds its world
        window.__bootSlowTimer = setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var m = document.getElementById('boot-msg');
          if (m) m.innerHTML = 'Building arena<span class="dots"></span>';
        }, 3500);

        setTimeout(function () {
          if (started() || alreadyTried) return;
          var u = new URL(location.href);
          u.searchParams.set('_boot', Date.now().toString(36));
          location.replace(u.toString());
        }, 4500);

        setTimeout(function () {
          if (mounted()) return;
          var msg = document.getElementById('boot-msg');
          var hint = document.getElementById('boot-hint');
          if (!msg) return;
          var scripts = document.querySelectorAll('script[src]');
          var list = [];
          for (var i = 0; i < scripts.length; i++) list.push(scripts[i].getAttribute('src'));
          var cameUp = !!window.__appStarted;
          msg.innerHTML = cameUp
            ? 'The engine loaded but the arena did not appear.'
            : 'The game script never ran.';
          hint.innerHTML =
            (cameUp
              ? 'The script executed, so this is a rendering/setup failure.'
              : 'The page loaded from cache or from the server, but its script could not be fetched — ' +
                'usually because the dev/preview server stopped.') +
            '<br>Requested scripts: <code>' + (list.join('</code>, <code>') || 'none') + '</code>' +
            '<br>Restart it with <code>npm install &amp;&amp; npm run dev</code> (or <code>python3 serve.py</code>) and reload.';
        }, 8000);
      })();
    </script>
  </body>
</html>
