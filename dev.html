<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MagicCloud — Open Field Combat Arena</title>
    <!-- Inline so the page is never a white screen, even if every external request fails. -->
    <style>
      html, body { margin:0; height:100%; background:#202923; color:#f0ecdf; font-family:'IBM Plex Sans',system-ui,sans-serif; }
      #boot { position:fixed; z-index:1000; inset:0; display:grid; place-items:center; padding:22px; overflow:hidden; text-align:center; background:radial-gradient(ellipse at 50% 38%,#46564e 0%,#303a35 48%,#1c2421 100%); transition:opacity .52s cubic-bezier(.22,.75,.25,1),visibility .52s; }
      #boot.boot-leaving { opacity:0; visibility:hidden; pointer-events:none; }
      #boot:before,#boot:after { content:''; position:absolute; width:min(72vw,540px); aspect-ratio:1; border:1px solid rgba(239,232,214,.13); transform:rotate(45deg); animation:boot-orbit 26s linear infinite; }
      #boot:after { width:min(88vw,720px); border-color:rgba(239,232,214,.07); animation-duration:38s; animation-direction:reverse; }
      #boot .box { position:relative; z-index:1; width:min(100%,520px); padding:clamp(26px,6vw,44px); border:1px solid rgba(239,232,214,.27); border-radius:18px; background:linear-gradient(145deg,rgba(46,55,49,.9),rgba(27,34,30,.94)); backdrop-filter:blur(18px); box-shadow:0 30px 90px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08); animation:boot-enter .72s cubic-bezier(.16,.8,.25,1) both; }
      #boot .boot-mark { position:relative; display:grid; place-items:center; width:54px; height:54px; margin:0 auto 22px; transform:rotate(45deg); border:1px solid rgba(239,232,214,.58); color:#f0ecdf; box-shadow:0 0 28px rgba(239,232,214,.12),inset 0 0 18px rgba(239,232,214,.08); }
      #boot .boot-mark:before { content:''; position:absolute; inset:6px; border:1px solid rgba(239,232,214,.2); animation:boot-mark-spin 14s linear infinite; }
      #boot .boot-mark span { transform:rotate(-45deg); font:700 14px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.08em; }
      #boot .kicker { margin-bottom:7px; color:rgba(239,232,214,.56); font:600 9px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.23em; }
      #boot .title { margin:0; color:#f0ecdf; font:700 clamp(24px,6vw,34px) 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.1em; text-shadow:0 0 26px rgba(239,232,214,.13); }
      #boot .subtitle { margin-top:7px; color:#c8ae77; font:600 10px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.2em; }
      #boot .boot-status { display:flex; justify-content:center; align-items:center; gap:9px; min-height:26px; margin-top:24px; }
      #boot .status-dot { width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:#c8ae77; box-shadow:0 0 12px rgba(200,174,119,.72); animation:boot-dot 1.4s ease-in-out infinite; }
      #boot .msg { color:#e7e3d7; font-size:13px; line-height:1.55; letter-spacing:.015em; }
      #boot .boot-progress { position:relative; height:3px; margin:15px auto 0; overflow:hidden; border-radius:4px; background:rgba(239,232,214,.12); }
      #boot .boot-progress i { position:absolute; inset:0 auto 0 -38%; width:38%; border-radius:inherit; background:linear-gradient(90deg,transparent,#dfd0aa 50%,transparent); animation:boot-sweep 1.7s cubic-bezier(.4,0,.6,1) infinite; }
      #boot .hint { margin-top:14px; color:#b8b2a4; font-size:12px; line-height:1.6; }
      #boot code { padding:1px 5px; border-radius:4px; background:rgba(255,255,255,.06); color:#e4cc96; }
      #boot .actions { display:none; justify-content:center; gap:10px; margin-top:18px; }
      #boot .btn { padding:8px 18px; border:1px solid rgba(239,232,214,.32); border-radius:7px; background:rgba(239,232,214,.08); color:#f0ecdf; cursor:pointer; font:600 11px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.08em; transition:background .16s,transform .16s; }
      #boot .btn:hover { transform:translateY(-1px); background:rgba(239,232,214,.17); }
      .dots:after { content:''; animation:d 1.2s steps(4,end) infinite; }
      @keyframes boot-orbit { to { transform:rotate(405deg); } }
      @keyframes boot-mark-spin { to { transform:rotate(360deg); } }
      @keyframes boot-enter { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
      @keyframes boot-sweep { to { transform:translateX(365%); } }
      @keyframes boot-dot { 50% { opacity:.45; transform:scale(.72); } }
      @keyframes d { 0% { content:''; } 25% { content:'.'; } 50% { content:'..'; } 75% { content:'...'; } }
      #boot .box { display:grid; grid-template-columns:minmax(150px,.68fr) minmax(0,1.32fr); gap:clamp(20px,4vw,44px); width:min(100%,820px); max-height:calc(100dvh - 28px); overflow:auto; padding:clamp(22px,4.5vw,42px); border-radius:4px; text-align:left; background:linear-gradient(135deg,rgba(43,54,47,.97),rgba(21,29,26,.99)); box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08),inset 0 0 45px rgba(197,176,127,.035); }
      #boot .boot-brand { display:flex; flex-direction:column; justify-content:center; min-width:0; padding-right:clamp(12px,2.5vw,28px); border-right:1px solid rgba(239,232,214,.18); }
      #boot .boot-mark { width:58px; height:58px; margin:0 0 24px 8px; }
      #boot .kicker { font-size:8px; letter-spacing:.19em; }
      #boot .title { font-size:clamp(21px,3.8vw,32px); line-height:1.04; letter-spacing:.075em; }
      #boot .subtitle { font-size:9px; letter-spacing:.14em; line-height:1.5; }
      #boot .boot-code { margin-top:24px; color:rgba(239,232,214,.43); font:600 8px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.14em; line-height:1.8; }
      #boot .boot-main { min-width:0; align-self:center; }
      #boot .boot-topline { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:11px; border-bottom:1px solid rgba(239,232,214,.13); color:rgba(239,232,214,.48); font:600 8px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.17em; }
      #boot .boot-phase { color:#d8c799; white-space:nowrap; }
      #boot .boot-status { justify-content:flex-start; min-height:28px; margin-top:17px; }
      #boot .msg { font-size:13px; }
      #boot .boot-progress { height:4px; margin:14px 0 0; background:rgba(239,232,214,.09); }
      #boot .boot-progress i { background:linear-gradient(90deg,transparent,#c8ae77 42%,#f0ecdf 52%,#c8ae77 62%,transparent); }
      #boot .boot-modules { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:18px; }
      #boot .boot-module { min-width:0; padding:9px 8px; border:1px solid rgba(239,232,214,.13); background:linear-gradient(150deg,rgba(239,232,214,.055),rgba(0,0,0,.12)); }
      #boot .boot-module b { display:block; margin-bottom:5px; color:rgba(239,232,214,.4); font:600 7px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.12em; }
      #boot .boot-module span { display:block; color:#e6e0d1; font:600 8px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.08em; white-space:nowrap; }
      #boot .boot-footer { grid-column:1/-1; display:flex; justify-content:space-between; gap:12px; padding-top:11px; border-top:1px solid rgba(239,232,214,.12); color:rgba(239,232,214,.35); font:600 7px 'Space Grotesk','IBM Plex Sans',sans-serif; letter-spacing:.13em; }
      #boot .hint { margin-top:13px; font-size:11px; }
      #boot .actions { justify-content:flex-start; }
      @media (max-width:560px) { #boot .box { grid-template-columns:1fr; gap:19px; text-align:center; } #boot .boot-brand { align-items:center; padding:0 0 15px; border-right:0; border-bottom:1px solid rgba(239,232,214,.18); } #boot .boot-mark { margin:0 0 13px; } #boot .boot-code { display:none; } #boot .boot-topline { font-size:7px; } #boot .boot-modules { gap:5px; } #boot .boot-module { padding:8px 5px; } #boot .boot-module span { font-size:7px; } #boot .boot-status,#boot .actions { justify-content:center; } #boot .boot-footer { font-size:6px; } }
      @media (prefers-reduced-motion:reduce) { #boot *,#boot:before,#boot:after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } #boot { transition:none; } }
    </style>
    <!-- No external requests at all: the page loads nothing but the document itself, so a
         blocked or 404-ing CDN can never show up as a console error or delay first paint. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23eee9dd'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="box">
        <div class="boot-brand">
          <div class="boot-mark" aria-hidden="true"><span>MC</span></div>
          <div class="kicker">FIELD OPERATIONS / BOOT SEQUENCE</div>
          <div class="title">MAGIC CLOUD</div>
          <div class="subtitle">OPEN FIELD COMBAT ARENA</div>
          <div class="boot-code">LOCAL BUILD<br>GRAPHICS · WEATHER · COMBAT</div>
        </div>
        <div class="boot-main">
          <div class="boot-topline"><span>ARENA SYSTEMS INITIALIZATION</span><span class="boot-phase" id="boot-phase">PREPARING</span></div>
          <div class="boot-status"><span class="status-dot" aria-hidden="true"></span><div class="msg" id="boot-msg">Preparing the arena<span class="dots"></span></div></div>
          <div class="boot-progress" aria-hidden="true"><i></i></div>
          <div class="boot-modules" aria-hidden="true">
            <div class="boot-module"><b>01 / ENGINE</b><span>WEBGL2 CORE</span></div>
            <div class="boot-module"><b>02 / WORLD</b><span>FIELD ASSEMBLY</span></div>
            <div class="boot-module"><b>03 / SYSTEMS</b><span>READY CHECK</span></div>
          </div>
          <div class="hint" id="boot-hint"></div>
          <div class="actions" id="boot-actions">
            <button type="button" class="btn" onclick="go('/?r=' + Date.now())">RETRY</button>
            <button type="button" class="btn" onclick="go('/?safe=1&r=' + Date.now())">SAFE MODE</button>
          </div>
        </div>
        <div class="boot-footer"><span>MAGIC CLOUD // FIELD CONSOLE</span><span>INITIALIZING<span class="dots"></span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx" onerror="window.__bootScriptFailed = true"></script>
    <script>
      // Boot watchdog.
      //
      // IMPORTANT: this must never reload the page on its own. An automatic reload can become an
      // endless loop (a proxy that rewrites query strings defeats any cache-buster guard), which
      // leaves the game unable to ever finish booting. Recovery is therefore offered as buttons
      // the user presses - that is always loop-safe.
      (function () {
        var root = function () { return document.getElementById('root'); };
        var mounted = function () { return !!(root() && root().childElementCount > 0); };
        var started = function () { return !!(window.__appStarted || mounted()); };
        // Retry navigates to "/" with a cache-buster; safe mode adds ?safe=1. Query strings are
        // enough on their own: if a proxy strips them we land on "/", which the server answers
        // with the current build (it sends no-store), so nothing here can 404 or loop.
        // /index.html and /safe also work when the server sees them (see serve.py).
        window.go = function (path) { location.href = path; };
        var setMsg = function (html) {
          var m = document.getElementById('boot-msg');
          if (m && !mounted()) m.innerHTML = html;
        };

        // Progress feedback: a slow first load must not look like a freeze.
        window.__bootTimer = setTimeout(function () {
          if (!started()) { setMsg('Loading the graphics engine<span class="dots"></span>'); var phase = document.getElementById('boot-phase'); if (phase) phase.textContent = 'ENGINE'; }
        }, 1200);
        window.__bootSlowTimer = setTimeout(function () {
          if (!mounted()) { setMsg('Assembling the arena<span class="dots"></span>'); var phase = document.getElementById('boot-phase'); if (phase) phase.textContent = 'WORLD'; }
        }, 4000);

        setTimeout(function () {
          if (mounted()) return;
          var hint = document.getElementById('boot-hint');
          if (!hint) return;

          var scripts = document.querySelectorAll('script[src]');
          var list = [];
          for (var i = 0; i < scripts.length; i++) list.push(scripts[i].getAttribute('src'));
          var scriptFailed = !!window.__bootScriptFailed;
          var cameUp = !!window.__appStarted;   // module executed but React never committed
          var listed = list.length ? '<code>' + list.join('</code>, <code>') + '</code>' : 'its script';

          if (scriptFailed) {
            setMsg('The game script could not be loaded.');
            hint.innerHTML = 'The page loaded, but ' + listed + ' was not fetched - usually this is a ' +
              'cached page from an earlier session while the server has stopped or changed.' +
              '<br>Press RETRY. If that keeps failing, force a fresh copy with <b>Ctrl+Shift+R</b> ' +
              '(Cmd+Shift+R on Mac).' +
              '<br>To restart the server: <code>npm run build &amp;&amp; python3 serve.py</code>';
          } else if (cameUp) {
            setMsg('The engine loaded but the arena did not appear.');
            hint.innerHTML = 'The game script ran, so this is a graphics or setup problem (low-end GPU, ' +
              'slow shader compile, or graphics settings that are too heavy).' +
              '<br>Press SAFE MODE to start with minimal graphics, or wait a little longer.';
          } else {
            setMsg('The game is taking longer than expected to start.');
            hint.innerHTML = listed + ' is still loading - expected on a slow connection or slow machine.' +
              '<br>Wait a little longer, or press RETRY to load it again.';
          }

          var actions = document.getElementById('boot-actions');
          if (actions) actions.style.display = 'flex';
        }, 8000);
      })();
    </script>
  </body>
</html>
